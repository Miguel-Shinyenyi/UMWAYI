# Save as .github/workflows/notify-site.yml in UMWAYI.
# Tells miguel-site to rebuild when anything the site reads from this repo changes.
# Needs one secret on UMWAYI: SITE_DISPATCH_TOKEN, a fine-grained personal access token
# scoped to the miguel-site repository only, with "Contents: Read and write" permission
# (GitHub requires that permission to send a repository_dispatch event).
name: Rebuild site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "projects/career-prep.md"
      - "projects/cmu-masters.md"
      - "projects/routine-machine.md"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger miguel-site deploy
        run: |
          curl -sS --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.SITE_DISPATCH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Miguel-Shinyenyi/miguel-site/dispatches \
            -d '{"event_type":"umwayi-content"}'