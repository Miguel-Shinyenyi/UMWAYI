name: progress

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      since:
        description: "Start date, YYYY-MM-DD"
        required: false
      until:
        description: "End date, YYYY-MM-DD"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick dates
        id: d
        run: |
          if [ -n "${{ inputs.since }}" ] && [ -n "${{ inputs.until }}" ]; then
            S="${{ inputs.since }}"; U="${{ inputs.until }}"
          else
            S=$(TZ=Africa/Nairobi date -d "last monday -7 days" +%F)
            U=$(TZ=Africa/Nairobi date -d "last monday -1 day" +%F)
          fi
          echo "since=$S" >> "$GITHUB_OUTPUT"
          echo "until=$U" >> "$GITHUB_OUTPUT"
      - name: Build digest
        run: |
          python3 scripts/progress.py --since "${{ steps.d.outputs.since }}" --until "${{ steps.d.outputs.until }}" \
            --repos progress/repos.txt --clones "$RUNNER_TEMP/clones" --clone \
            > "progress/${{ steps.d.outputs.since }}-to-${{ steps.d.outputs.until }}.md"
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          B="content/progress-${{ steps.d.outputs.since }}"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -b "$B"
          git add progress
          git diff --cached --quiet && exit 0
          git commit -m "Add progress digest ${{ steps.d.outputs.since }} to ${{ steps.d.outputs.until }}"
          git push origin "$B"
          gh pr create --title "Progress digest ${{ steps.d.outputs.since }} to ${{ steps.d.outputs.until }}" \
            --body "Generated by scripts/progress.py from git history. Review and merge."
