<title id="t">Pinned to its source</title>
<desc id="d">A source page with one edited line and a rule card pinned to it by a hash tag. The tag no longer matches and a stop sign sits beside it. A sheep reads the card. The shepherd says if the source changes, stop and ask.</desc>
