<title id="t">Up from ask, never from no</title>
<desc id="d">A dial with three marks labelled ask, yes and no, with the pointer on ask. Beside it a list of gates with check marks and a lock on the no mark. A sheep sits at the base of the dial. The shepherd says only up from ask, never from no.</desc>
